name: c15 patch
on:
  push:
    paths:
      - .github/workflows/_c15_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply patch
        run: |
          python3 - <<'PY'
          import io
          p='src/inc/inc11_rid.inc'
          s=io.open(p,encoding='utf-8').read()
          assert s.count('static void drawRid() {')==1
          s=s.replace('static void drawRid() {','static void drawRidText() {')
          io.open(p,'w',encoding='utf-8').write(s)
          p='src/inc/inc10_core.inc'
          s=io.open(p,encoding='utf-8').read()
          assert s.count('if (now - s_ridDrawMs >= 1000)')==1
          s=s.replace('if (now - s_ridDrawMs >= 1000)','if (now - s_ridDrawMs >= 250)')
          io.open(p,'w',encoding='utf-8').write(s)
          p='src/main.cpp'
          s=io.open(p,encoding='utf-8').read()
          a='#include "inc/inc11_rid.inc"'
          assert s.count(a)==1
          s=s.replace(a, a+'\n#include "inc/inc11b_ridui.inc"')
          io.open(p,'w',encoding='utf-8').write(s)
          print('patched ok')
          PY
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_c15_patch.yml
          git add -A
          git commit -m "feat(rid): 雷达扫描动画接入主循环(250ms) + 量程自适应"
          git push
