name: c18 patch
on:
  push:
    paths:
      - .github/workflows/_c18_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'PY'
          import io
          p='src/inc/inc11_rid.inc'
          s=io.open(p,encoding='utf-8').read()

          a1='  sc->setInterval(200);\n  sc->setWindow(100);'
          assert s.count(a1)==1, 'a1'
          s=s.replace(a1,'  sc->setInterval(320);\n  sc->setWindow(80);')

          a2='  Serial.println("[rid] s5c params set itvl=200 win=100");'
          assert s.count(a2)==1, 'a2'
          s=s.replace(a2,'  Serial.println("[rid] s5c params set itvl=320 win=80");')

          a3='''  while (s_ridBleTaskRun) {
              Serial.printf("[rid] s5c2 gap_disc 6s heap=%u\\n", (unsigned)ESP.getFreeHeap());
              sc->start(6, false);
              Serial.printf("[rid] s5d start ret heap=%u ble=%d\\n",
                            (unsigned)ESP.getFreeHeap(), s_ridBle ? 1 : 0);'''
          assert s.count(a3)==1, 'a3'
          s=s.replace(a3,'''  int loopN = 0;
            while (s_ridBleTaskRun) {
              if ((loopN++ % 5) == 0)
                Serial.printf("[rid] s5c2 gap_disc 6s heap=%u\\n", (unsigned)ESP.getFreeHeap());
              sc->start(6, false);
              if ((loopN % 5) == 0)
                Serial.printf("[rid] s5d start ret heap=%u ble=%d\\n",
                              (unsigned)ESP.getFreeHeap(), s_ridBle ? 1 : 0);''')

          a4='if (now - s_ridHbdMs >= 10000UL) {'
          assert s.count(a4)==1, 'a4'
          s=s.replace(a4,'if (now - s_ridHbdMs >= 30000UL) {')

          io.open(p,'w',encoding='utf-8').write(s)
          print('patch ok')
          PY
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_c18_patch.yml
          git add -A
          git commit -m "fix(rid): BLE 扫描占空回退 25%、日志节流（50% 占空下整机静默）"
          git push
