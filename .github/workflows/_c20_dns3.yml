name: c20 dns fix3
on:
  push:
    paths:
      - .github/workflows/_c20_dns3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          sed -i '/WiFi.config(IPAddress(0, 0, 0, 0)/d' src/inc/inc10_core.inc
          sed -i 's#^  startWeb();$#  WiFi.config(INADDR_NONE, INADDR_NONE, INADDR_NONE, IPAddress(114, 114, 114, 114), IPAddress(223, 5, 5, 5));\n  Serial.println("[dns] pinned after connect");\n  startWeb();#' src/inc/inc10_core.inc
          echo "--- ctx ---"
          grep -n 'WiFi.config\|WiFi.begin(s_ssid\|startWeb()\|\\[dns\\]' src/inc/inc10_core.inc
          A=$(grep -c 'WiFi.config' src/inc/inc10_core.inc)
          test "$A" -eq 1
          grep -q 'INADDR_NONE' src/inc/inc10_core.inc
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_c20_dns3.yml
          git add -A
          git commit -m "fix(dns): DNS 改在连接成功后设置（netif 未 up 时 config 直接返回 false）"
          git push
