name: c19 patch
on:
  push:
    paths:
      - .github/workflows/_c19_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          cat >> src/inc/inc11b_ridui.inc <<'CPP'

          // 侦测页长按 BT = 开/关被动侦测；其它页长按仍是换量程（调用方继续往下走）。
          static bool ridKeyLongAction() {
            if (s_screen != SCR_RID) return false;
            if (s_ridOn || s_ridWant) {
              s_ridWant = false;
              s_ridOffReq = true;
              Serial.println("[key] long -> rid stop");
            } else {
              s_ridWant = true;
              s_ridWantMs = millis();
              Serial.println("[key] long -> rid start");
            }
            return true;
          }
          CPP
          sed -i 's|    s_rangeAuto = false; // manual range choice beats the boot auto-fit|    if (ridKeyLongAction()) return; s_rangeAuto = false;|' src/inc/inc10_core.inc
          sed -i 's|txtC("按键启动", 230, C_GRAY);|txtC("长按开启", 230, C_GRAY);|' src/inc/inc11b_ridui.inc
          grep -n 'ridKeyLongAction' src/inc/inc10_core.inc src/inc/inc11b_ridui.inc
          grep -n '长按开启' src/inc/inc11b_ridui.inc
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_c19_patch.yml
          git add -A
          git commit -m "feat(rid): 侦测页长按 BT 开关侦测，屏幕提示改为长按开启"
          git push
