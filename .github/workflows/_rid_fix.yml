name: rid-js-script-tag-fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'rid script tag') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch rid page
        run: |
          set -e
          if grep -q 'h += "<script>";' src/inc/inc11_rid.inc; then
            echo "already patched"
          else
            sed -i 's|^  h += RID_JS;$|  h += "<script>";\n  h += RID_JS;\n  h += "</script>";|' src/inc/inc11_rid.inc
          fi
          grep -n 'script>' src/inc/inc11_rid.inc
      - name: commit and clean up
        run: |
          set -e
          if git diff --quiet -- src/inc/inc11_rid.inc; then
            echo "nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q .github/workflows/_rid_fix.yml
            git add src/inc/inc11_rid.inc
            git commit -m "fix(web): /rid 内联 JS 补 script 标签（rid script tag）"
            git push
          fi
