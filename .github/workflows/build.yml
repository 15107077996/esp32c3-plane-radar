name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PlatformIO
        run: |
          pip install --quiet platformio esptool

      - name: Build
        run: |
          pio run 2>&1 | tee build.log

      - name: Collect and merge binaries
        run: |
          mkdir -p firmware
          cp .pio/build/esp32c3/firmware.bin firmware/app.bin
          cp .pio/build/esp32c3/bootloader.bin /tmp/bootloader.bin
          cp .pio/build/esp32c3/partitions.bin /tmp/partitions.bin
          esptool --chip esp32c3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o firmware/firmware.bin \
            0x0 /tmp/bootloader.bin \
            0x8000 /tmp/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 firmware/app.bin
          ls -l firmware/

      - name: Verify merged image
        run: |
          python - <<'PY'
          blob = open("firmware/firmware.bin", "rb").read()
          assert blob[0x0] == 0xE9, "bootloader magic missing"
          assert blob[0x8000] == 0xAA and blob[0x8001] == 0x50, "partition table missing"
          assert blob[0x10000] == 0xE9, "app image missing"
          print("merged ok", len(blob))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/

      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f firmware
          if ! git diff --cached --quiet; then
            git commit -m "chore: update firmware build output"
            git push
          else
            echo "no change"
          fi
