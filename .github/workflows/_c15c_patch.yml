name: c15c patch
on:
  push:
    paths:
      - .github/workflows/_c15c_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          sed -i 's/256614000, 1147650000, 1100, 1080, 256610000, 1147640000/256650000, 1147720000, 1100, 1080, 256645000, 1147710000/g' src/inc/inc11_rid.inc
          grep -n '256650000' src/inc/inc11_rid.inc
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_c15c_patch.yml
          git add -A
          git commit -m "test(rid): 注入帧位移到约 800m 外"
          git push
