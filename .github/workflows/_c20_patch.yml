name: c20 dns patch
on:
  push:
    paths:
      - .github/workflows/_c20_patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          sed -i 's#^  startWeb();$#  IPAddress dnsDhcp = WiFi.dnsIP();\n  WiFi.setDNS(IPAddress(114, 114, 114, 114), IPAddress(223, 5, 5, 5));\n  Serial.printf("[dns] dhcp=%s now=%s/%s\\n", dnsDhcp.toString().c_str(), WiFi.dnsIP().toString().c_str(), WiFi.dnsIP(1).toString().c_str());\n  startWeb();#' src/inc/inc10_core.inc
          echo "--- result ---"
          sed -n '272,286p' src/inc/inc10_core.inc
          N=$(grep -c 'dnsDhcp' src/inc/inc10_core.inc)
          echo "grep_count=$N"
          test "$N" -eq 2
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_c20_patch.yml
          git add -A
          git commit -m "fix(dns): 固定公共 DNS，修复所有域名请求 hostByName 失败"
          git push
