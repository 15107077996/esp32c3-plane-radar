name: c19 readme img
on:
  push:
    paths:
      - .github/workflows/_c19_img3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: readme
        run: |
          sed -i 's#| 航班雷达 | 时钟 | 降雨云图 | 系统自检 |#| 航班雷达 | 时钟 | 降雨云图 | 系统自检 | 无人机侦测 |#' README.md
          sed -i 's#| :---: | :---: | :---: | :---: |#| :---: | :---: | :---: | :---: | :---: |#' README.md
          sed -i 's#| ![自检](images/selftest.jpg) |#| ![自检](images/selftest.jpg) | ![侦测](images/rid.jpg) |#' README.md
          sed -i 's#以上为本机实拍（照片摄于 `1.3.1-c3`；`1.4.x` 的天气页排版与新增的无人机侦测页尚未补拍）#实拍：航班雷达 / 时钟 / 降雨云图 / 系统自检摄于 `1.3.1-c3`，无人机侦测页为 `1.4.6-c19` 实拍（长按 BT 开启后的状态），天气页新版排版尚未补拍#' README.md
          sed -n '4,12p' README.md
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/_c19_img3.yml images/_imgdiag.txt
          git add -A
          git commit -m "docs: README 引用侦测页实拍图，清理临时文件"
          git push
